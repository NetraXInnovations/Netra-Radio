name: Refresh Radio, eBooks and Audio Books lists

on:
  schedule:
    - cron: '30 20 * * *'   # every day at 02:00 India time
  workflow_dispatch: {}       # "Run workflow" button on GitHub
  push:
    paths:
      - 'settings.json'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.js
      - name: Save the new lists
        run: |
          git config user.name "netra-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily lists $(date -u +%Y-%m-%d)"
          git push
      - name: Clear the jsDelivr cache so phones get today's lists
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/catalog.json" > /dev/null || true
